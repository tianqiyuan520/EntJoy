name: EntJoy Release Gate

on:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build solution
        run: dotnet build EntJoy.sln -c Release -p:EnableNativeCompile=false

      - name: Build ECS tests
        run: dotnet build tests/EntJoy.ECS.Tests/EntJoy.ECS.Tests.csproj -c Release

      - name: Run ECS tests repeatedly
        shell: pwsh
        run: |
          1..5 | ForEach-Object {
            Write-Host "ECS test pass $_/5"
            dotnet test tests/EntJoy.ECS.Tests/EntJoy.ECS.Tests.csproj -c Release --no-build --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  windows-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure C++ tests
        run: cmake -S tests/NativeDll.Tests -B build -A x64
      - name: Build C++ tests
        run: cmake --build build --config Release
      - name: Run C++ tests
        run: |
          set -e
          for test in JobSystemTests ChaseLevIntegrationTests AssistLifetimeTests ImplicitBatchTests MPMCInjectorTests SparseTileDequeTests SparseTileDequeSmoketest SparseTileDequeTrace; do
            ./build/Release/$test.exe
          done
        shell: bash

      - name: Build and run stage regressions
        run: |
          set -e
          for stage in Stage2_BatchLifetime Stage3_SchedulerLifecycle Stage6_CppExceptionSafety Stage7_DeferDepth Stage9_BatchStorageRace Stage10_ImplicitBatchToggle; do
            cmake -S tools/JobSystemBugTests/$stage -B tools/JobSystemBugTests/$stage/build -A x64
            cmake --build tools/JobSystemBugTests/$stage/build --config Release
            ./tools/JobSystemBugTests/$stage/build/Release/$stage.exe
          done
        shell: bash

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build ABI fixture stubs
        run: |
          cmake -S tools/JobSystemBugTests/Stage11_AbiFixture -B tools/JobSystemBugTests/Stage11_AbiFixture/build -A x64
          cmake --build tools/JobSystemBugTests/Stage11_AbiFixture/build --config Release
        shell: bash

      - name: Build NativeDll for C# tests
        run: |
          cmake -S tools/NativeDllCore -B tools/NativeDllCore/build -A x64
          cmake --build tools/NativeDllCore/build --config Release
        shell: bash

      - name: Build C# JobSystem regressions
        run: |
          dotnet build tools/JobSystemBugTests/Stage1_CSharpBridge/Stage1_CSharpBridge.csproj -c Release
          dotnet build tools/JobSystemBugTests/Stage4_AbiCompatibility/Stage4_AbiCompatibility.csproj -c Release
          dotnet build tools/JobSystemBugTests/Stage8_CompleteRetain/Stage8_CompleteRetain.csproj -c Release
          dotnet build tools/JobSystemBugTests/Stage11_AbiFixture/Stage11_AbiFixture.csproj -c Release
          dotnet build tools/JobSystemStressTest.CSharp/JobSystemStressTest.CSharp.csproj -c Release
        shell: bash

      - name: Run C# JobSystem regressions
        run: |
          set -e
          native=tools/NativeDllCore/build/Release/NativeDll.dll
          for app in Stage1_CSharpBridge Stage4_AbiCompatibility Stage8_CompleteRetain Stage11_AbiFixture; do
            cp "$native" "tools/JobSystemBugTests/$app/bin/Release/net8.0/NativeDll.dll"
          done
          cp "$native" tools/JobSystemStressTest.CSharp/bin/Release/net8.0/NativeDll.dll

          ./tools/JobSystemBugTests/Stage1_CSharpBridge/bin/Release/net8.0/Stage1_CSharpBridge.exe
          ./tools/JobSystemBugTests/Stage4_AbiCompatibility/bin/Release/net8.0/Stage4_AbiCompatibility.exe "$native"
          ./tools/JobSystemBugTests/Stage8_CompleteRetain/bin/Release/net8.0/Stage8_CompleteRetain.exe
          ./tools/JobSystemBugTests/Stage11_AbiFixture/bin/Release/net8.0/Stage11_AbiFixture.exe \
            tools/JobSystemBugTests/Stage11_AbiFixture/build/Release/stub_no_abi.dll \
            tools/JobSystemBugTests/Stage11_AbiFixture/build/Release/stub_wrong_version.dll
          ./tools/JobSystemStressTest.CSharp/bin/Release/net8.0/JobSystemStressTest.CSharp.exe --timeout 60
        shell: bash

  # 生成器回归（NativeTranspiler）：CI 里唯一会**真正编译生成物**的 job。
  # 背景：framework-test 用 -p:EnableNativeCompile=false 构建，NativeCompileTask 被条件跳过 ⇒
  # 生成的 C++/ISPC 从不被编译、静默降级标记（__ENTJOY_UNSUPPORTED）也从不被扫描。
  # 本 job 跑 tools/NativeTranspilerFixture：生成 → 标记扫描 → CMake/ClangCL(或 MSVC 回退) → 原生编译
  # → 运行时语义断言（IJobParallelForBatch 区间调度、批内 return; 语义）；再做一次负向自检。
  # ⚠ 尚未挂进 release-gate：GitHub runner 上 clang-cl 组件是否存在未验证（缺则回退 MSVC），
  #   先观察若干轮再决定是否设为必需检查。
  native-transpiler-regression:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build + run generator fixture (native compile + runtime semantics)
        run: dotnet run --project tools/NativeTranspilerFixture/NativeTranspilerFixture.csproj -c Release

      - name: Negative check (marker gate must fail the build)
        shell: pwsh
        run: ./tools/NativeTranspilerFixture/negative-check.ps1

  ispc-width-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install ISPC
        run: |
          $zip = "$env:RUNNER_TEMP\ispc.zip"
          Invoke-WebRequest -Uri "https://github.com/ispc/ispc/releases/download/v1.30.0/ispc-v1.30.0-windows.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ispc"
          $ispcExe = Get-ChildItem "$env:RUNNER_TEMP\ispc" -Recurse -Filter "ispc.exe" | Select-Object -First 1
          $ispcExe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii
        shell: pwsh

      - name: Build and run width boundary test
        run: |
          set -e
          cmake -S tools/ISPCWidthBoundaryTest -B tools/ISPCWidthBoundaryTest/build -A x64
          cmake --build tools/ISPCWidthBoundaryTest/build --config Release
          ./tools/ISPCWidthBoundaryTest/build/Release/width_test_sse4.exe
          ./tools/ISPCWidthBoundaryTest/build/Release/width_test_avx2.exe
          set +e
          ./tools/ISPCWidthBoundaryTest/build/Release/width_test_avx512.exe
          avx512_exit=$?
          set -e
          if [ $avx512_exit -eq 0 ]; then
            echo "avx512: PASS"
          else
            echo "avx512: skipped (exit $avx512_exit; runner may not support AVX512)"
          fi
        shell: bash

  linux-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Configure ASAN+UBSAN
        run: >
          cmake -S tests/NativeDll.Tests -B build-asan
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
        shell: bash
      - name: Build ASAN+UBSAN
        run: cmake --build build-asan -j
      - name: Run ASAN+UBSAN
        run: |
          set -e
          for test in JobSystemTests ChaseLevIntegrationTests AssistLifetimeTests ImplicitBatchTests MPMCInjectorTests SparseTileDequeTests SparseTileDequeSmoketest SparseTileDequeTrace; do
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ./build-asan/$test
          done
        shell: bash

      - name: Configure TSAN
        run: >
          cmake -S tests/NativeDll.Tests -B build-tsan
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
        shell: bash
      - name: Build TSAN
        run: cmake --build build-tsan -j
      - name: Run TSAN
        run: |
          set -e
          for test in JobSystemTests ChaseLevIntegrationTests AssistLifetimeTests ImplicitBatchTests MPMCInjectorTests SparseTileDequeTests SparseTileDequeSmoketest SparseTileDequeTrace; do
            TSAN_OPTIONS=halt_on_error=1 ./build-tsan/$test
          done
        shell: bash

  release-gate:
    if: always()
    needs: [framework-test, windows-test, ispc-width-test, linux-sanitizers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check
        run: |
          test "${{ needs.framework-test.result }}" = "success"
          test "${{ needs.windows-test.result }}" = "success"
          test "${{ needs.ispc-width-test.result }}" = "success"
          test "${{ needs.linux-sanitizers.result }}" = "success"
