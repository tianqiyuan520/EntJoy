name: EntJoy Release Gate

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      extended:
        description: Run repeated long stress tests
        type: boolean
        default: false
  workflow_call:
    inputs:
      extended:
        type: boolean
        default: false
  schedule:
    - cron: '17 18 * * 0'

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify public documentation throughout Git history
        run: python3 .github/scripts/check-public-docs.py
      - name: Validate workflow syntax and expressions
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  framework-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build solution
        # EntJoySample 里有多个非注释 Main ⇒ 入口由 EntJoySample.csproj 的**缺省 StartupObject** 提供
        # （需要别的入口时用 -p:ENTJOY_STARTUP=<全限定类型名> 覆盖）。
        run: dotnet build EntJoy.sln -c ${{ matrix.configuration }} -p:EnableNativeCompile=false -p:ENTJOY_STARTUP=EntJoySample.Relationship.Program

      - name: Jobs-only transpiler guard
        # 无 ECS 引用的消费方必须能用 [NativeTranspile] 数组 job（生成物不得含 ECS 耦合）。
        # 断言与自证逻辑见 tests/JobsOnlyTranspilerCheck/check.ps1。
        shell: pwsh
        run: ./tests/JobsOnlyTranspilerCheck/check.ps1 -Configuration ${{ matrix.configuration }}

      - name: Build ECS tests
        run: dotnet build tests/EntJoy.ECS.Tests/EntJoy.ECS.Tests.csproj -c ${{ matrix.configuration }}

      - name: NativeTranspiler unit tests
        run: dotnet test tests/NativeTranspiler.Tests/NativeTranspiler.Tests.csproj -c ${{ matrix.configuration }} --nologo --logger trx --results-directory TestResults --blame-hang --blame-hang-timeout 90s

      # Hot-reload behaviour gate. The native end-to-end evidence (P1-7 / P2-4 / P4) lives in
      # tools/HotReloadProbe — gitignored scaffolding with absolute toolchain paths — so it cannot
      # run here. These tests need no native build and no compiler: they assert the pure-managed
      # contract (reload-result contract + watcher detection/copy semantics).
      - name: Hot-reload contract tests
        run: dotnet test tests/HotReload.Tests/HotReload.Tests.csproj -c ${{ matrix.configuration }} --nologo --logger trx --results-directory TestResults --blame-hang --blame-hang-timeout 90s

      # 后端必须显式指定并断言（ENTJOY_TEST_BACKEND）：
      # EntJoy.ECS.Tests 的输出目录默认没有 NativeDll.dll，而 NativeJobCore 的 ModuleInitializer 会沿
      # BaseDirectory → 入口目录 → 程序集目录 → CWD 上溯 探测，于是同一套测试会随本地 bin/ 内容静默切换后端。
      # 历史问题：文档宣称「测试集运行在 Native」，实际 CI 跑的是 Managed 回退。两条腿都跑，且由
      # BackendSelectionTests 断言实际后端 == 请求后端，杜绝「native 腿悄悄降级成 Managed 仍全绿」。
      - name: Run ECS tests (Managed fallback backend, 2x)
        shell: pwsh
        env:
          ENTJOY_TEST_BACKEND: managed
        run: |
          1..2 | ForEach-Object {
            Write-Host "ECS test pass (managed) $_/2"
            dotnet test tests/EntJoy.ECS.Tests/EntJoy.ECS.Tests.csproj -c ${{ matrix.configuration }} --no-build --no-restore --logger "trx;LogFileName=managed-$_.trx" --results-directory TestResults --blame-hang --blame-hang-timeout 90s
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Stage NativeDll for the native-backend leg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S tools/NativeDllCore -B tools/NativeDllCore/build-ci -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build tools/NativeDllCore/build-ci --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item tools/NativeDllCore/build-ci/Release/NativeDll.dll tests/EntJoy.ECS.Tests/bin/${{ matrix.configuration }}/net8.0/ -Force

      - name: Run ECS tests (Native backend, assist off/on)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ENTJOY_TEST_BACKEND: native
        run: |
          foreach ($assist in 0, 1) {
            $env:ENTJOY_MAIN_ASSIST = "$assist"
            Write-Host "ECS native test pass: assist=$assist"
            dotnet test tests/EntJoy.ECS.Tests/EntJoy.ECS.Tests.csproj -c ${{ matrix.configuration }} --no-build --no-restore --logger "trx;LogFileName=native-assist-$assist.trx" --results-directory TestResults --blame-hang --blame-hang-timeout 90s
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Save managed test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-${{ matrix.os }}-${{ matrix.configuration }}-${{ github.run_attempt }}
          path: TestResults/
          retention-days: 14

  relationship-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: managed
          - os: windows-latest
            backend: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build relationship validation
        run: dotnet build tools/RelationshipValidation/RelationshipValidation.csproj -c Release
      - name: Stage NativeDll for relationship validation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S tools/NativeDllCore -B tools/NativeDllCore/build-relationship-ci -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build tools/NativeDllCore/build-relationship-ci --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item tools/NativeDllCore/build-relationship-ci/Release/NativeDll.dll tools/RelationshipValidation/bin/Release/net8.0/ -Force
      - name: Verify process and result gate failure detection
        shell: pwsh
        run: |
          ./.github/scripts/Test-TestProcess.ps1
          ./.github/scripts/Test-RelationshipResults.ps1
      - name: M:N scale, steady and batch allocation budgets
        shell: pwsh
        run: ./.github/scripts/Invoke-RelationshipChecks.ps1 -Backend '${{ matrix.backend }}' -Extended:('${{ inputs.extended || github.event_name == 'schedule' }}' -eq 'true')
      - name: Save relationship measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationships-${{ matrix.os }}-${{ matrix.backend }}-${{ github.run_attempt }}
          path: ci-reports/relationships/
          if-no-files-found: error
          retention-days: 14

  windows-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure C++ tests
        run: cmake -S tests/NativeDll.Tests -B build -A x64
      - name: Build C++ tests
        run: cmake --build build --config Release --parallel 4
      - name: Run C++ tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error --output-junit Testing/native.xml

      - name: Repeat concurrency and lifetime regressions
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error -L "Concurrency|Lifetime" --repeat until-fail:5 --output-junit Testing/repeated.xml

      - name: Build and run stage regressions
        run: |
          set -e
          for stage in Stage2_BatchLifetime Stage3_SchedulerLifecycle Stage6_CppExceptionSafety Stage7_DeferDepth Stage9_BatchStorageRace Stage10_ImplicitBatchToggle; do
            cmake -S tools/JobSystemBugTests/$stage -B tools/JobSystemBugTests/$stage/build -A x64
            cmake --build tools/JobSystemBugTests/$stage/build --config Release --parallel 4
            ./tools/JobSystemBugTests/$stage/build/Release/$stage.exe
          done
        shell: bash

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build ABI fixture stubs
        run: |
          cmake -S tools/JobSystemBugTests/Stage11_AbiFixture -B tools/JobSystemBugTests/Stage11_AbiFixture/build -A x64
          cmake --build tools/JobSystemBugTests/Stage11_AbiFixture/build --config Release
        shell: bash

      - name: Build NativeDll for C# tests
        run: |
          cmake -S tools/NativeDllCore -B tools/NativeDllCore/build -A x64
          cmake --build tools/NativeDllCore/build --config Release
        shell: bash

      - name: Build C# JobSystem regressions
        run: |
          dotnet build tools/JobSystemBugTests/Stage1_CSharpBridge/Stage1_CSharpBridge.csproj -c Release
          dotnet build tools/JobSystemBugTests/Stage4_AbiCompatibility/Stage4_AbiCompatibility.csproj -c Release
          dotnet build tools/JobSystemBugTests/Stage8_CompleteRetain/Stage8_CompleteRetain.csproj -c Release
          dotnet build tools/JobSystemBugTests/Stage11_AbiFixture/Stage11_AbiFixture.csproj -c Release
          dotnet build tools/JobSystemStressTest.CSharp/JobSystemStressTest.CSharp.csproj -c Release
        shell: bash

      - name: Run C# JobSystem regressions
        run: |
          set -e
          native=tools/NativeDllCore/build/Release/NativeDll.dll
          for app in Stage1_CSharpBridge Stage4_AbiCompatibility Stage8_CompleteRetain Stage11_AbiFixture; do
            cp "$native" "tools/JobSystemBugTests/$app/bin/Release/net8.0/NativeDll.dll"
          done
          cp "$native" tools/JobSystemStressTest.CSharp/bin/Release/net8.0/NativeDll.dll

          ./tools/JobSystemBugTests/Stage1_CSharpBridge/bin/Release/net8.0/Stage1_CSharpBridge.exe
          ./tools/JobSystemBugTests/Stage4_AbiCompatibility/bin/Release/net8.0/Stage4_AbiCompatibility.exe "$native"
          ./tools/JobSystemBugTests/Stage8_CompleteRetain/bin/Release/net8.0/Stage8_CompleteRetain.exe
          ./tools/JobSystemBugTests/Stage11_AbiFixture/bin/Release/net8.0/Stage11_AbiFixture.exe \
            tools/JobSystemBugTests/Stage11_AbiFixture/build/Release/stub_no_abi.dll \
            tools/JobSystemBugTests/Stage11_AbiFixture/build/Release/stub_wrong_version.dll
        shell: bash

      - name: Scheduler stress across worker and assist configurations
        shell: pwsh
        run: |
          . ./.github/scripts/Invoke-TestProcess.ps1
          New-Item -ItemType Directory -Force ci-reports | Out-Null
          $stressExe = './tools/JobSystemStressTest.CSharp/bin/Release/net8.0/JobSystemStressTest.CSharp.exe'
          $cases = @(@{ name = 'full'; arguments = @('--timeout', '180'); assist = '1'; timeout = 900 })
          foreach ($workers in 1, 2, 4, 8) {
            foreach ($assist in 0, 1) {
              $cases += @{ name = "workers-$workers-assist-$assist"; arguments = @('--timeout', '180', '--workers', "$workers", '--contracts-only'); assist = "$assist"; timeout = 180 }
            }
          }
          $failures = @()
          "### Scheduler stress`n`n| Configuration | Exit code |`n| --- | --- |" >> $env:GITHUB_STEP_SUMMARY
          foreach ($case in $cases) {
            $env:ENTJOY_MAIN_ASSIST = $case.assist
            $arguments = $case.arguments
            Write-Host "::group::$($case.name)"
            $result = Invoke-TestProcess -FilePath $stressExe -Arguments $arguments -LogPath "ci-reports/$($case.name).log" -TimeoutSeconds $case.timeout
            Write-Host '::endgroup::'
            "| $($case.name) | $result |" >> $env:GITHUB_STEP_SUMMARY
            if ($result -ne 0) { $failures += $case.name }
          }
          if ($failures.Count) { throw "Scheduler stress failed: $($failures -join ', ')" }

      - name: Save native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-${{ github.run_attempt }}
          path: |
            build/Testing/
            ci-reports/
          retention-days: 14

  linux-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure GCC Debug
        run: cmake -S tests/NativeDll.Tests -B build-debug -DCMAKE_BUILD_TYPE=Debug
      - name: Build GCC Debug
        run: cmake --build build-debug --parallel 4
      - name: Run native Debug tests
        run: ctest --test-dir build-debug --output-on-failure --no-tests=error --output-junit Testing/native.xml
      - name: Repeat Debug concurrency and lifetime regressions
        run: ctest --test-dir build-debug --output-on-failure --no-tests=error -L 'Concurrency|Lifetime' --repeat until-fail:5 --output-junit Testing/repeated.xml
      - name: Save Debug reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-debug-${{ github.run_attempt }}
          path: build-debug/Testing/
          retention-days: 14

  # 生成器回归（NativeTranspiler）：CI 里唯一会**真正编译生成物**的 job。
  # 背景：framework-test 用 -p:EnableNativeCompile=false 构建，NativeCompileTask 被条件跳过 ⇒
  # 生成的 C++/ISPC 从不被编译、静默降级标记（__ENTJOY_UNSUPPORTED）也从不被扫描。
  # 本 job 跑 tools/NativeTranspilerFixture：生成 → 标记扫描 → CMake/ClangCL(或 MSVC 回退) → 原生编译
  # → 运行时语义断言（IJobParallelForBatch 区间调度、批内 return; 语义）；再做一次负向自检。
  # 2026-09-26：**已纳入 release-gate 必需检查**。原先顾虑「runner 上 clang-cl 是否存在」，但该 job
  # 在缺 ClangCL 时会自动回退 MSVC，因此顾虑不成立；而它是唯一能拦住「生成物编译不过 / 静默降级」的关卡，
  # 留在门禁外等于发布不检查 codegen。若真有环境问题，应先修 job 而不是继续豁免。
  native-transpiler-regression:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      ENTJOY_JOB_WORKERS: '4'
      ENTJOY_MAIN_ASSIST: '1'
    steps:
      # 生成物 CMake 在 WIN32 下无条件编 imgui 调试面板（ENTJOY_IMGUI_ENABLED=1）
      # ⇒ 必须带出 src/NativeDll/thirdParty/imgui 子模块（imgui @ v1.91.6）。
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ISPC
        shell: pwsh
        run: ./tools/ISPCWidthBoundaryTest/install.ps1

      - name: Validate process exit codes and deadlock timeout
        shell: pwsh
        run: ./.github/scripts/Test-TestProcess.ps1

      - name: Build generator fixture (C++/AutoSIMD/ISPC)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-reports | Out-Null
          dotnet build tools/NativeTranspilerFixture/NativeTranspilerFixture.csproj -c ${{ matrix.configuration }} -p:FixtureIspc=true 2>&1 | Tee-Object ci-reports/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generated semantics across worker and assist configurations
        shell: pwsh
        run: |
          . ./.github/scripts/Invoke-TestProcess.ps1
          $fixture = './tools/NativeTranspilerFixture/bin/${{ matrix.configuration }}/net8.0/NativeTranspilerFixture.exe'
          $failures = @()
          "### Generated semantics (${{ matrix.configuration }})`n`n| Workers | Assist | Mode | Exit code |`n| --- | --- | --- | --- |" >> $env:GITHUB_STEP_SUMMARY
          foreach ($workers in 1, 2, 4, 8) {
            foreach ($assist in 0, 1) {
              $env:ENTJOY_JOB_WORKERS = "$workers"
              $env:ENTJOY_MAIN_ASSIST = "$assist"
              foreach ($mode in 'semantics', 'copy') {
                $caseName = "workers-$workers-assist-$assist-$mode"
                $arguments = if ($mode -eq 'copy') { @('copy') } else { @() }
                Write-Host "::group::$caseName"
                $result = Invoke-TestProcess -FilePath $fixture -Arguments $arguments -LogPath "ci-reports/$caseName.log"
                Write-Host '::endgroup::'
                "| $workers | $assist | $mode | $result |" >> $env:GITHUB_STEP_SUMMARY
                if ($result -ne 0) { $failures += $caseName }
              }
            }
          }
          if ($failures.Count) { throw "Generated semantics failed: $($failures -join ', ')" }

      - name: Handle lifetime and allocation contract
        shell: pwsh
        run: |
          . ./.github/scripts/Invoke-TestProcess.ps1
          $fixture = './tools/NativeTranspilerFixture/bin/${{ matrix.configuration }}/net8.0/NativeTranspilerFixture.exe'
          $failures = @()
          foreach ($workers in 2, 4) {
            foreach ($assist in 0, 1) {
              $env:ENTJOY_JOB_WORKERS = "$workers"
              $env:ENTJOY_MAIN_ASSIST = "$assist"
              $caseName = "ownership-workers-$workers-assist-$assist"
              Write-Host "::group::$caseName"
              $result = Invoke-TestProcess -FilePath $fixture -Arguments @('alloc') -LogPath "ci-reports/$caseName.log"
              Write-Host '::endgroup::'
              "| $workers | $assist | ownership/alloc | $result |" >> $env:GITHUB_STEP_SUMMARY
              if ($result -ne 0) { $failures += $caseName }
            }
          }
          if ($failures.Count) { throw "Ownership/allocation contract failed: $($failures -join ', ')" }

      - name: Run published source consumer outside the repository
        shell: pwsh
        run: |
          . ./.github/scripts/Invoke-TestProcess.ps1
          $publishDir = Join-Path $env:RUNNER_TEMP 'fixture-published'
          dotnet publish tools/NativeTranspilerFixture/NativeTranspilerFixture.csproj -c ${{ matrix.configuration }} -p:FixtureIspc=true --no-restore -o $publishDir 2>&1 | Tee-Object ci-reports/publish.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in 'NativeDll.dll', 'NativeTranspiled.dll', 'NativeTranspiled.layout.json') {
            if (-not (Test-Path -LiteralPath (Join-Path $publishDir $file))) { throw "Published fixture is missing $file" }
          }
          $log = Join-Path $env:GITHUB_WORKSPACE 'ci-reports/published-semantics.log'
          Push-Location $publishDir
          try {
            $result = Invoke-TestProcess -FilePath './NativeTranspilerFixture.exe' -LogPath $log
            if ($result -ne 0) { exit $result }
          } finally { Pop-Location }

      - name: Build and run Relationship sample (C++/ISPC)
        shell: pwsh
        run: |
          . ./.github/scripts/Invoke-TestProcess.ps1
          $sampleDir = Join-Path $env:RUNNER_TEMP 'relationship-sample'
          dotnet build samples/EntJoySample/EntJoySample.csproj -c ${{ matrix.configuration }} -p:ENTJOY_STARTUP=EntJoySample.Relationship.Program -o $sampleDir 2>&1 | Tee-Object ci-reports/relationship-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Invoke-TestProcess -FilePath (Join-Path $sampleDir 'EntJoySample.exe') -LogPath 'ci-reports/relationship-sample.log' -TimeoutSeconds 180
          if ($result -ne 0) { exit $result }
          if (-not (Select-String -LiteralPath ci-reports/relationship-sample.log -SimpleMatch 'PASS: all Relationship scenarios.' -Quiet)) { throw 'Relationship sample did not finish its scenarios.' }

      - name: Negative check (marker gate must fail the build)
        shell: pwsh
        run: ./tools/NativeTranspilerFixture/negative-check.ps1 -Configuration ${{ matrix.configuration }}

      - name: Save generator execution reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-transpiler-${{ matrix.configuration }}-${{ github.run_attempt }}
          path: ci-reports/
          retention-days: 14

      - name: Save generated sources on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-generated-${{ matrix.configuration }}-${{ github.run_attempt }}
          path: |
            tools/NativeTranspilerFixture/NativeTranspiler_Generated/*.cpp
            tools/NativeTranspilerFixture/NativeTranspiler_Generated/*.ispc
            tools/NativeTranspilerFixture/NativeTranspiler_Generated/*.h
            tools/NativeTranspilerFixture/NativeTranspiler_Generated/CMakeLists.txt
          retention-days: 14

  # NuGet 包消费回归：pack 四个包 → 从本地 feed 还原 → 两个 PackageReference-only 消费者构建并运行。
  #   tests/NuGetConsumer     ：ECS 侧（托管 ECS + 原生 JobSystem + 转译的 IJobParallelFor/IJobChunk/IJobEntity）
  #   tests/NuGetJobsConsumer ：Jobs-only 侧（只装 EntJoy.Jobs，无 EntJoy.ECS，四种数组 job 形态转译为 native）
  # 这是 CI 里唯一覆盖"消费者从包消费"的 job（其它 job 都是仓库内源码引用）。
  # 不依赖 ISPC、也不依赖 clang-cl：两个消费者只编 Cpp 后端，CMake 无 ClangCL 时会回退 MSVC。
  nuget-consumer-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 一键：stage 预编译原生制品（tools/NativeDllCore）→ dotnet pack 四包 → 清 NuGet 缓存
      # → 两个消费者 restore/build/run（断言不通过即非 0 退出）
      - name: Stage native artifacts, pack, and run NuGet consumers
        shell: pwsh
        run: ./tests/NuGetConsumer/run.ps1

  ispc-width-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install ISPC
        shell: pwsh
        run: ./tools/ISPCWidthBoundaryTest/install.ps1

      - name: Build and run width boundary test
        shell: pwsh
        run: |
          cmake -S tools/ISPCWidthBoundaryTest -B tools/ISPCWidthBoundaryTest/build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build tools/ISPCWidthBoundaryTest/build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/ISPCWidthBoundaryTest/build/Release/width_test_sse4.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/ISPCWidthBoundaryTest/build/Release/width_test_avx2.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $avx512Supported = [System.Runtime.Intrinsics.X86.Avx512F]::IsSupported -and
            [System.Runtime.Intrinsics.X86.Avx512BW]::IsSupported -and
            [System.Runtime.Intrinsics.X86.Avx512CD]::IsSupported -and
            [System.Runtime.Intrinsics.X86.Avx512DQ]::IsSupported -and
            [System.Runtime.Intrinsics.X86.Avx512F+VL]::IsSupported
          if ($avx512Supported) {
            ./tools/ISPCWidthBoundaryTest/build/Release/width_test_avx512.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'AVX512 SKX unavailable; skipping execution.'
          }

  linux-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Configure ASAN+UBSAN
        run: >
          cmake -S tests/NativeDll.Tests -B build-asan
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
        shell: bash
      - name: Build ASAN+UBSAN
        run: cmake --build build-asan -j
      - name: Run ASAN+UBSAN
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure --no-tests=error --output-junit Testing/native.xml

      - name: Configure TSAN
        run: >
          cmake -S tests/NativeDll.Tests -B build-tsan
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
        shell: bash
      - name: Build TSAN
        run: cmake --build build-tsan -j
      - name: Run TSAN
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-tsan --output-on-failure --no-tests=error --output-junit Testing/native.xml

      - name: Save sanitizer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-sanitizers-${{ github.run_attempt }}
          path: |
            build-asan/Testing/
            build-tsan/Testing/
          retention-days: 14

  # Core scheduler portability check on real weak-memory hardware.
  # The distributed NuGet runtime remains win-x64.
  arm64-native:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Configure
        run: >
          cmake -S tests/NativeDll.Tests -B build-arm64
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
        shell: bash
      - name: Build
        run: cmake --build build-arm64 -j

      - name: Run all native suites (aarch64)
        run: ctest --test-dir build-arm64 --output-on-failure --no-tests=error --output-junit Testing/native.xml

      - name: Repeat wake-liveness checks
        run: ctest --test-dir build-arm64 --output-on-failure --no-tests=error -R '^WakeLivenessTests$' --repeat until-fail:20 --output-junit Testing/repeated.xml
      - name: Save ARM64 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-native-${{ github.run_attempt }}
          path: build-arm64/Testing/
          retention-days: 14

  extended-stress:
    if: inputs.extended == true || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      STRESS_LONG: '1'
      STRESS_ROUNDS: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build stress executables and native runtime
        shell: bash
        run: |
          set -e
          cmake -S tools/JobSystemStressTest -B build-stress -A x64
          cmake --build build-stress --config Release --parallel 4
          cmake -S tools/NativeDllCore -B build-core -A x64
          cmake --build build-core --config Release --parallel 4
          dotnet build tools/JobSystemStressTest.CSharp -c Release
          cp build-core/Release/NativeDll.dll tools/JobSystemStressTest.CSharp/bin/Release/net8.0/
      - name: Run repeated native long stress
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p stress-reports
          ./build-stress/Release/JobSystemStressTest.exe --timeout 120 2>&1 | tee stress-reports/native.log
      - name: Run repeated managed and native-bridge long stress
        shell: bash
        run: |
          set -e
          set -o pipefail
          ./tools/JobSystemStressTest.CSharp/bin/Release/net8.0/JobSystemStressTest.CSharp.exe --timeout 120 --workers 4 2>&1 | tee stress-reports/bridge.log
      - name: Save long stress reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-stress-${{ github.run_attempt }}
          path: stress-reports/
          retention-days: 14

  release-gate:
    if: always()
    needs: [workflow-validation, framework-test, relationship-test, windows-test, linux-debug, nuget-consumer-test, ispc-width-test, linux-sanitizers, native-transpiler-regression, arm64-native, extended-stress]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize release checks
        if: always()
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            printf '### Release checks\n\n| Check | Result |\n| --- | --- |\n'
            printf '%s' "$CHECK_RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require every release check
        run: |
          test "${{ needs.workflow-validation.result }}" = "success"
          test "${{ needs.linux-debug.result }}" = "success"
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            test "${{ needs.arm64-native.result }}" = "success"
          fi
          if [ "${{ inputs.extended }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            test "${{ needs.extended-stress.result }}" = "success"
          fi
          test "${{ needs.framework-test.result }}" = "success"
          test "${{ needs.relationship-test.result }}" = "success"
          test "${{ needs.windows-test.result }}" = "success"
          test "${{ needs.nuget-consumer-test.result }}" = "success"
          test "${{ needs.ispc-width-test.result }}" = "success"
          test "${{ needs.linux-sanitizers.result }}" = "success"
          test "${{ needs.native-transpiler-regression.result }}" = "success"
